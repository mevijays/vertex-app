name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests + coverage -> GitHub step summary
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        id: run_tests
        run: |
          set +e
          go test -race -covermode=atomic -coverprofile=coverage.out -v ./... > test-output.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat test-output.log

      - name: Publish test & coverage summary
        if: always()
        run: |
          {
            echo "## 🧪 Unit test results"
            echo

            passed=$(grep -c '^--- PASS:' test-output.log || true)
            failed=$(grep -c '^--- FAIL:' test-output.log || true)
            skipped=$(grep -c '^--- SKIP:' test-output.log || true)

            if [ "${{ steps.run_tests.outputs.exit_code }}" = "0" ]; then
              echo "**Status: ✅ All tests passed**"
            else
              echo "**Status: ❌ Tests failed**"
            fi
            echo

            echo "| Result | Count |"
            echo "| --- | --- |"
            echo "| ✅ Passed | ${passed} |"
            echo "| ❌ Failed | ${failed} |"
            echo "| ⏭️ Skipped | ${skipped} |"
            echo

            if [ "${failed}" -gt 0 ]; then
              echo "<details><summary>Failed tests</summary>"
              echo
              echo '```'
              grep '^--- FAIL:' test-output.log || true
              echo '```'
              echo "</details>"
              echo
            fi

            echo "## 📊 Code coverage"
            echo

            if [ -f coverage.out ]; then
              go tool cover -func=coverage.out > coverage.txt
              total=$(tail -1 coverage.txt | awk '{print $3}')
              echo "**Total coverage: ${total}**"
              echo
              echo "<details><summary>Per-function coverage</summary>"
              echo
              echo '```text'
              cat coverage.txt
              echo '```'
              echo "</details>"
            else
              echo "_No coverage data produced._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            test-output.log
          retention-days: 14

      - name: Fail job if tests failed
        if: steps.run_tests.outputs.exit_code != '0'
        run: exit 1

  # ---------------------------------------------------------------------------
  # Build the Go binary + vulnerability scan -> GitHub step summary
  # ---------------------------------------------------------------------------
  build-and-scan:
    name: Build & vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o server ./cmd/server

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        id: govulncheck
        run: |
          set +e
          govulncheck ./... > govulncheck.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat govulncheck.log

      - name: Publish vulnerability scan summary
        if: always()
        run: |
          {
            echo "## 🔒 Vulnerability scan (govulncheck)"
            echo

            if grep -q "No vulnerabilities found" govulncheck.log; then
              echo "**Status: ✅ No known vulnerabilities found**"
            elif [ "${{ steps.govulncheck.outputs.exit_code }}" = "0" ]; then
              echo "**Status: ✅ Scan completed, no issues reported**"
            else
              count=$(grep -c '^Vulnerability #' govulncheck.log || true)
              echo "**Status: ⚠️ ${count} potential vulnerabilit$([ "$count" = "1" ] && echo y || echo ies) found — review before relying on this build**"
              echo "::warning title=govulncheck::${count} potential vulnerabilities found; see the job summary"
            fi
            echo

            echo "<details><summary>Full govulncheck output</summary>"
            echo
            echo '```text'
            cat govulncheck.log
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
        # Informational only: a vulnerable transitive dependency shouldn't block
        # every merge by itself. Findings are still surfaced above and as a
        # workflow warning annotation. Flip this job to fail on findings by
        # changing the step above to `exit "${{ steps.govulncheck.outputs.exit_code }}"`.

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: server
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Build & push the container image to GHCR
  # ---------------------------------------------------------------------------
  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [test, build-and-scan]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name (lowercase)
        run: echo "IMAGE_NAME=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image summary
        if: always()
        run: |
          {
            echo "## 🐳 Container image"
            echo
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Build-only (pull requests are not pushed to GHCR)."
            else
              echo "Pushed to **${{ env.IMAGE_NAME }}**:"
              echo
              echo '```text'
              echo "${{ steps.meta.outputs.tags }}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
