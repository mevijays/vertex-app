# Manual-only deploy to GKE.
#
# Prerequisite (not yet in this repo's Terraform): a GCP Workload Identity
# Federation pool + provider trusting token.actions.githubusercontent.com for
# this repo, and a deploy GSA bound to it — so this workflow authenticates to
# GCP with zero stored keys/secrets, the same "no service-account key" rule
# the rest of this project follows. Configure as repository variables:
#   vars.GCP_WORKLOAD_IDENTITY_PROVIDER  e.g. projects/123/locations/global/workloadIdentityPools/github/providers/github
#   vars.GCP_DEPLOY_SERVICE_ACCOUNT      e.g. gke-deployer@vertex-lab-201086.iam.gserviceaccount.com

name: Deploy to GKE

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image reference to deploy (tag or digest form, from the Docker publish workflow summary)"
        type: string
        required: true
      project_id:
        description: "GCP project ID"
        type: string
        default: "vertex-lab-201086"
      gke_cluster:
        description: "GKE cluster name"
        type: string
        default: "crc-cluster"
      gke_location:
        description: "GKE cluster zone/region"
        type: string
        default: "europe-west3-a"
      namespace:
        description: "Kubernetes namespace"
        type: string
        default: "default"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to mint the OIDC token for GCP Workload Identity Federation

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud & kubectl
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin,kubectl"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ inputs.gke_cluster }}
          location: ${{ inputs.gke_location }}
          project_id: ${{ inputs.project_id }}

      # k8s/deployment.yaml ships with YOUR_PROJECT_ID placeholders so the repo
      # stays project-agnostic. Substitute the real project before applying —
      # the Workload Identity annotation and GOOGLE_CLOUD_PROJECT must both
      # carry the actual project ID or the pod cannot reach Vertex AI.
      - name: Render manifests
        run: |
          sed -i "s|YOUR_PROJECT_ID|${{ inputs.project_id }}|g" k8s/deployment.yaml
          echo "--- rendered manifest ---"
          cat k8s/deployment.yaml
          if grep -q "YOUR_PROJECT_ID" k8s/deployment.yaml; then
            echo "::error::placeholder substitution failed"
            exit 1
          fi

      - name: Deploy
        run: |
          kubectl apply -n "${{ inputs.namespace }}" -f k8s/deployment.yaml
          kubectl set image deployment/vertex-chat \
            vertex-chat="${{ inputs.image }}" \
            -n "${{ inputs.namespace }}"
          kubectl rollout status deployment/vertex-chat \
            -n "${{ inputs.namespace }}" --timeout=5m

      - name: Publish deploy summary
        if: always()
        run: |
          {
            echo "## 🚀 GKE deployment"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Image** | \`${{ inputs.image }}\` |"
            echo "| **Cluster** | \`${{ inputs.gke_cluster }}\` (\`${{ inputs.gke_location }}\`, project \`${{ inputs.project_id }}\`) |"
            echo "| **Namespace** | \`${{ inputs.namespace }}\` |"
            echo "| **Triggered by** | @${{ github.actor }} |"
            echo
            kubectl get service vertex-chat -n "${{ inputs.namespace }}" -o wide >> service.txt 2>&1 || true
            if [ -s service.txt ]; then
              echo "**Service:**"
              echo
              echo '```text'
              cat service.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
