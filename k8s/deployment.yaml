# Vertex Chat — GKE manifests
#
# YOUR_PROJECT_ID is a placeholder so this repo stays project-agnostic. The
# deploy workflow (.github/workflows/deploy.yml) substitutes it with the real
# project ID at apply time. If you apply this file by hand, substitute it
# yourself first — the Workload Identity annotation and GOOGLE_CLOUD_PROJECT
# below both need the real value or the pod cannot reach Vertex AI.
#
# Assumes GKE Workload Identity is enabled on the cluster. The ServiceAccount
# below is the Kubernetes-side half of the KSA <-> GSA binding; the binding
# itself is created by Terraform (see google_service_account_iam_member
# .vertex_gemini_workload_identity in main.tf).
#
# The image below is only a default — the deploy workflow overwrites it with
# the exact image you dispatch. CI publishes to ghcr.io/mevijays/vertex-app
# (see .github/workflows/docker-publish.yml). Note that GHCR packages are
# private by default; either make the package public or add an
# imagePullSecret (commented block below), or pods will hit ImagePullBackOff.
#
# Exposure: the Service is ClusterIP, not LoadBalancer — the app is reached
# through the Istio ingress gateway in k8s/ingressgateway.yaml (Managed
# Anthos Service Mesh), not its own public IP. The VirtualService below
# attaches to that gateway (istio-ingress/vertex-chat-gateway) by explicit
# <namespace>/<name>, since the Gateway resource lives in a different
# namespace. The DestinationRule sets tls.mode: DISABLE explicitly: these
# pods have no sidecar (only istio-ingress is labeled for injection), so the
# gateway must speak plain HTTP to them, not mesh mTLS — Istio's automatic
# mTLS detection can be flaky right after a fresh apply, so this is spelled
# out rather than left to be inferred.
#
# AUTH_TOKEN (the static shared login token gating both the UI and the
# OpenAI-compatible API) is deliberately NOT a plain `value:` here — this is
# a public repo. It must exist as a Secret before the first deploy:
#   kubectl create secret generic vertex-chat-auth --namespace default \
#     --from-literal=token="$(openssl rand -base64 32)"
# Rotate it later with the same command (add --dry-run=client -o yaml | kubectl
# apply -f - to update in place) followed by a rollout restart — the app
# validates cookies via an HMAC derived from this token, so rotating it
# invalidates every existing login instantly.
#
# replicas: 1 is required, not just cost-motivated: conversations/documents/
# saved prompts are stored in SQLite on the PersistentVolumeClaim below, and
# a ReadWriteOnce PVC can only attach to one node's pod at a time — two
# concurrent replicas would either fail to schedule or corrupt the single
# writer's WAL. If this ever needs to scale beyond one replica, SQLite has to
# be replaced with a real network database first.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vertex-chat-ksa
  namespace: default
  annotations:
    iam.gke.io/gcp-service-account: vertex-gemini-client@vertex-lab-201086.iam.gserviceaccount.com

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vertex-chat-data
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  # confirm with `kubectl get storageclass` before first apply if this
  # cluster's default differs
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vertex-chat
  namespace: default
  labels:
    app: vertex-chat
spec:
  replicas: 1
  # maxSurge: 0 is now doubly required: a ReadWriteOnce PVC can only attach
  # to one node's pod at a time, so surging a second pod before the first
  # exits would risk FailedAttachVolume, on top of the original CPU
  # constraint below. maxUnavailable: 1 means a rollout briefly has zero
  # replicas — acceptable for this app's traffic level.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: vertex-chat
  template:
    metadata:
      labels:
        app: vertex-chat
    spec:
      serviceAccountName: vertex-chat-ksa
      # A freshly provisioned GCE PD is mounted owned by root:root, which the
      # nonroot (UID 65532) container can't write to — SQLite then fails with
      # "unable to open database file (14)". fsGroup makes the kubelet chown
      # the PVC (and emptyDir) to this GID on mount so the container's
      # matching primary group can write to it.
      securityContext:
        fsGroup: 65532
      containers:
        - name: vertex-chat
          image: ghcr.io/mevijays/vertex-app:latest
          # imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: "YOUR_PROJECT_ID"
            - name: GOOGLE_CLOUD_LOCATION
              value: "global"
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "true"
            - name: MODEL_ID
              value: "gemini-3.5-flash"
            - name: REQUEST_TIMEOUT
              value: "300s"
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vertex-chat-auth
                  key: token
            - name: DB_PATH
              value: "/data/vertex-chat.db"
            - name: TMPDIR
              value: "/tmp"
          # Kept small deliberately: a 3-node e2-medium cluster has only ~940m
          # allocatable CPU per node, and GKE system pods + Managed Service Mesh
          # (istio-cni, gke-metadata-server, GMP, kube-dns) already reserve most
          # of it. Larger requests leave replicas Pending with "Insufficient
          # cpu". Limits stay high so the app can still burst.
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            # The distroless base declares `USER nonroot` by *name*, which the
            # kubelet cannot verify against runAsNonRoot ("image has non-numeric
            # user (nonroot), cannot verify user is non-root"). 65532 is that
            # user's numeric UID, so the check passes without weakening it.
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # readOnlyRootFilesystem stays on — the PVC mount and the emptyDir
          # below are the only two paths the app ever writes to (the SQLite
          # file/WAL and, defensively, anything that wants a writable TMPDIR).
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vertex-chat-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      # Uncomment when pulling from a private registry (e.g. artifactory.mylab.lan)
      # that isn't Google Artifact Registry:
      # imagePullSecrets:
      #   - name: artifactory-pull-cred

---
apiVersion: v1
kind: Service
metadata:
  name: vertex-chat
  namespace: default
  labels:
    app: vertex-chat
spec:
  type: ClusterIP
  selector:
    app: vertex-chat
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: vertex-chat
  namespace: default
spec:
  host: vertex-chat.default.svc.cluster.local
  trafficPolicy:
    tls:
      mode: DISABLE

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: vertex-chat
  namespace: default
spec:
  hosts:
    - "*"
  gateways:
    - istio-ingress/vertex-chat-gateway
  http:
    - route:
        - destination:
            host: vertex-chat.default.svc.cluster.local
            port:
              number: 80
