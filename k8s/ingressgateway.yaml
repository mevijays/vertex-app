# Istio ingress gateway, fronting vertex-chat through the Managed Anthos
# Service Mesh already enabled in main.tf (google_gke_hub_feature_membership
# .mesh, management = MANAGEMENT_AUTOMATIC). This is the platform-owned half
# of the setup: the Namespace, gateway workload, its Service, and the
# abstract Gateway resource. The VirtualService/DestinationRule that actually
# route traffic to vertex-chat live in deployment.yaml instead, next to the
# app they belong to — this file only defines the shared Gateway they attach
# to by name (istio-ingress/vertex-chat-gateway).
#
# Sized deliberately small: this cluster runs autoscaling 3-5 nodes (see
# main.tf) with each e2-medium node around 940m allocatable, and GKE system
# pods + the mesh's own components (istio-cni, gke-metadata-server, GMP,
# kube-dns) already reserve most of a node. A single replica at 50m/64Mi
# request lets it schedule without forcing a scale-up in the common case;
# raise both replicas and resources once real traffic needs it.

apiVersion: v1
kind: Namespace
metadata:
  name: istio-ingress
  labels:
    # Required for the asm-managed sidecar-injection webhook to select this
    # namespace (istio-injection: enabled is the OLD Istio convention and is
    # explicitly excluded by the webhook's namespaceSelector under Managed ASM).
    istio.io/rev: asm-managed

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: istio-ingressgateway
  namespace: istio-ingress

---
# Lets the gateway proxy read the TLS Secret cert-manager writes
# (k8s/cert-manager-issuer.yaml) via SDS, referenced from the Gateway
# resource's tls.credentialName below.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: istio-ingressgateway-sds
  namespace: istio-ingress
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: istio-ingressgateway-sds
  namespace: istio-ingress
subjects:
  - kind: ServiceAccount
    name: istio-ingressgateway
roleRef:
  kind: Role
  name: istio-ingressgateway-sds
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: istio-ingressgateway
  namespace: istio-ingress
  labels:
    app: istio-ingressgateway
    istio: ingressgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: istio-ingressgateway
      istio: ingressgateway
  template:
    metadata:
      labels:
        app: istio-ingressgateway
        istio: ingressgateway
      annotations:
        # Selects Istio's "gateway" injection template instead of the default
        # sidecar template — the whole pod IS the proxy, there's no app
        # container to sidecar alongside.
        inject.istio.io/templates: "gateway"
    spec:
      serviceAccountName: istio-ingressgateway
      containers:
        - name: istio-proxy
          image: auto # replaced by the injector with the current revision's proxy image
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

---
apiVersion: v1
kind: Service
metadata:
  name: istio-ingressgateway
  namespace: istio-ingress
  labels:
    app: istio-ingressgateway
    istio: ingressgateway
spec:
  type: LoadBalancer
  selector:
    app: istio-ingressgateway
    istio: ingressgateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      # 8443, not 443: the proxy runs as non-root (runAsNonRoot above) and
      # can't bind ports <1024, so Istio's gateway injection remaps
      # privileged ports it's given in the Gateway resource below (443) to
      # 8000+port internally — the same reason port 80 above targets 8080.
      targetPort: 8443

---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: vertex-chat-gateway
  namespace: istio-ingress
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      tls:
        # 301s every HTTP request to the same host/path over https:// — the
        # cert is issued and stable now, so plain HTTP has no reason to stay
        # served. Raw-IP access (http://34.159.29.36/) still redirects too,
        # but lands on an HTTPS listener with no matching SNI host for the
        # IP, so it won't resolve — vertex.mevijay.io is the only real entry
        # point going forward.
        httpsRedirect: true
      hosts:
        - "*"
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        # Populated by cert-manager (k8s/cert-manager-issuer.yaml) once the
        # Certificate is issued — this Secret doesn't exist until then, so
        # this listener stays inactive/unhealthy until issuance succeeds.
        credentialName: vertex-chat-tls
      hosts:
        - "vertex.mevijay.io"
